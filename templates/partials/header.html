{% load static %}
<header class="site-header">
  <div class="container">
    <div class="brand">
      <img class="brand-logo" src="{% static 'img/logo-128.png' %}" alt="Kisii County seal" width="44" height="44">
      <div>
        <div class="brand-kicker">COUNTY GOVERNMENT OF KISII</div>
        <div class="brand-name">Office Directory</div>
      </div>
    </div>
    {% if user.is_authenticated %}
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
    <nav class="site-nav" id="site-menu" aria-label="Main">
      <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
      <a href="{% url 'directory' %}" {% if request.resolver_match.url_name == 'directory' %}class="active"{% endif %}>Directory</a>
      <a href="{% url 'department_list' %}" {% if request.path|slice:":13" == "/departments/" %}class="active"{% endif %}>Departments</a>
      <a href="{% url 'office_list' %}" {% if request.path|slice:":9" == "/offices/" %}class="active"{% endif %}>Offices</a>
      <a href="{% url 'staff_list' %}" {% if request.path|slice:":7" == "/staff/" %}class="active"{% endif %}>Staff</a>
      {% if perms.audit.view_auditlog %}<a href="{% url 'audit_log' %}" {% if request.path|slice:":7" == "/audit/" %}class="active"{% endif %}>Audit log</a>{% endif %}
    </nav>
    <div class="userbar">
      <span class="role-pill {% if not is_administrator %}role-pill--user{% endif %}">{{ role_label }}</span>
      <a href="{% url 'account_settings' %}" class="settings-link" aria-label="Settings" title="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a><span>{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}" class="logout-form">
        {% csrf_token %}
        <button type="submit" class="link-button">Sign out</button>
      </form>
    </div>
    {% endif %}
  </div>
</header>
